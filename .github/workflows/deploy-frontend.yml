name: Deploy Frontend a Hostinger

# Corre en TODO push a main, no solo cuando cambia frontend/ -- confirmado
# el 14/08 que el redeploy del Node.js App (que se dispara con cualquier
# push a main, toque o no backend/) vacia public_html como efecto
# colateral de su propio ciclo de build, aunque su "Directorio root" este
# configurado en backend/ y nunca toque frontend/. Sin este trigger amplio,
# cualquier merge no relacionado con el frontend rompe el sitio en vivo.
on:
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde Actions, para probar credenciales

jobs:
  deploy:
    name: Subir frontend por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Deploy vía FTPS a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
