name: Deploy Frontend a Hostinger

# Corre en TODO push a main (no solo cambios de frontend/) y ademas cada
# 15 min por horario. Confirmado el 14/08 con los Registros de runtime de
# Hostinger que public_html se vacia por su cuenta, sin relacion con ningun
# push -- el Node.js App real corre desde una carpeta versionada propia
# (hbuilds/versions/<id>/) que nunca tuvo frontend/ (su "Directorio root"
# esta fijado en backend/ y no hay forma de cambiarlo sin recrear la app).
# public_html es la capa que Hostinger sirve primero y la que mantenemos
# sincronizada; el cron es la red de seguridad para cuando se resetea sola.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # permite correrlo a mano desde Actions, para probar credenciales

jobs:
  deploy:
    name: Subir frontend por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Deploy vía FTPS a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
