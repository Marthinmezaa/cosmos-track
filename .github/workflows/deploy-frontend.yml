name: Deploy Frontend a Hostinger

# Solo corre cuando algo dentro de frontend/ cambia en main, para no
# disparar una subida FTP innecesaria en cada release o cambio de backend.
#
# El backend y el frontend son DOS despliegues separados en Hostinger
# (confirmado en hPanel -> Despliegues: el Node.js App tiene "Directorio
# root: backend", nunca toca frontend/). Este workflow reemplaza la subida
# manual de frontend/ a public_html por hPanel.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: # permite correrlo a mano desde Actions, para probar credenciales

jobs:
  deploy:
    name: Subir frontend por FTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Deploy vía FTPS a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
